<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>Ma liste de tâches</h1>
      <form id="formulaire-tache">
        <label for="nouvelle-tache">Nouvelle tâche</label>
        <input id="nouvelle-tache" name="tache" type="text" placeholder="Ex. Faire les exercices" required>
        <button type="submit">Ajouter</button>
      </form>
      <ul id="liste"></ul>
    </main>
  </body>
</html>
